name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Senza chiave fissa la release sarebbe firmata con una chiave debug a caso e
      # non si installerebbe sopra le versioni precedenti: meglio fallire.
      - name: Require signing key
        run: test -n "$KEYSTORE_PATH" || { echo "::error::KEYSTORE_BASE64 mancante"; exit 1; }

      - name: Check version matches tag
        run: |
          NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "v$NAME" = "$GITHUB_REF_NAME" ] || { echo "::error::versionName $NAME ≠ tag $GITHUB_REF_NAME"; exit 1; }

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Nome fisso per il link di prima installazione (Downloader):
      # https://github.com/sonnysini/sblorftz-timer/releases/latest/download/sblorftz-timer.apk
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/sblorftz-timer.apk

      # Le note sono la sezione del CHANGELOG: l'app le mostra nel popup di aggiornamento.
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ ("^## " v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Nuova versione di Sblorftz Timer." > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Sblorftz Timer ${{ github.ref_name }}
          body_path: notes.md
          files: dist/sblorftz-timer.apk
